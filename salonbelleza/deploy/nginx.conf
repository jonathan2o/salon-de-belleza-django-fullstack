# Configuración de Nginx para Salon Belleza
# Instalar en: /etc/nginx/sites-available/salonbelleza
# Habilitar:   ln -s /etc/nginx/sites-available/salonbelleza /etc/nginx/sites-enabled/
# Reemplazar TU_DOMINIO por el dominio real (el script deploy/deploy.sh lo hace solo).

server {
    listen 80;
    server_name TU_DOMINIO www.TU_DOMINIO;

    # Frontend React compilado (frontend/build)
    root /home/salonbelleza/salonbelleza/frontend/build;
    index index.html;

    # SPA (react-router): servir index.html para rutas del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos estaticos de Django (admin)
    location /static/ {
        alias /home/salonbelleza/salonbelleza/staticfiles/;
    }

    # API -> Gunicorn (127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin de Django -> Gunicorn
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
